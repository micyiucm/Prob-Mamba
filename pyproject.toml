[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prob-mamba"
version = "0.1.0"
description = "Modular tools for probabilistic time-series forecasting with Mamba"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "pandas",
    "scikit-learn",
    "torch>=2.1",
]

[project.optional-dependencies]
data = ["pyarrow"]
baselines = ["arch", "statsmodels"]
mamba = ["causal-conv1d==1.5.2", "mamba-ssm"]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["feature_selection", "preprocessing_pipeline"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
